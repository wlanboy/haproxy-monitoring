# Quelle für HAProxy-Backends und Host-Routing.
# Nach jeder Änderung:  uv run scripts/generate_haproxy.py
# Erzeugt haproxy/backends.cfg und haproxy/hosts.map (beide nicht von Hand ändern).
#
# Felder pro Backend:
#   name         Pflicht. Backend heißt <name>_backend, Server <name>1..n
#                (<name>-1..n, wenn der Name auf eine Ziffer endet).
#   description  Optional. Text in der Stats-UI.
#   servers      Pflicht. Liste von host:port.
#   hosts        Optional. Host-Header für das Routing, Standard <name>.<domain>.
#   health_uri   Optional. Eigener Check-Pfad statt "/" aus defaults.

domain: localhost

backends:
  - name: gitea
    description: "Gitea (nginx:80)"
    servers: [nginx:80, nginx:80, nginx:80]

  - name: gmk8090
    description: "Web (nginx:80)"
    servers: [nginx:80, nginx:80, nginx:80]

  - name: gmk9443
    description: "Secure Web (nginx:80)"
    servers: [nginx:80, nginx:80, nginx:80]

  - name: api
    description: "API Service (gmk.lan:8090)"
    servers: [nginx:80, nginx:80, nginx:80]


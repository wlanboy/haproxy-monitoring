global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option forwardfor
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    retries 3
    # Health-Checks für alle Backends (einzelne Backends können das überschreiben)
    option httpchk
    http-check send meth GET uri /
    http-check expect rstatus 2[0-9][0-9]|3[0-9][0-9]
    default-server check inter 10s fall 3 rise 2

#---------------------------------------------------------------------
# Stats-UI & Prometheus-Metrics Endpoint
#---------------------------------------------------------------------
frontend stats
    bind *:8404
    monitor-uri /healthz
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-node
    stats show-legends
    stats auth stats:statssecret
    no log

#---------------------------------------------------------------------
# HTTP-Frontend – Routing per Host-Header (<name>.localhost)
#   curl -H 'Host: api.localhost' http://localhost:8080/
#   Browser: http://api.localhost:8080/ (*.localhost zeigt auf 127.0.0.1)
# Unbekannte Hosts landen auf gitea_backend.
#---------------------------------------------------------------------
frontend http_in
    bind *:8080
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower

    use_backend gmk8090_backend       if { var(txn.host) -m str gmk8090.localhost }
    use_backend gmk9443_backend       if { var(txn.host) -m str gmk9443.localhost }
    use_backend api_backend           if { var(txn.host) -m str api.localhost }
    use_backend auth_backend          if { var(txn.host) -m str auth.localhost }
    use_backend users_backend         if { var(txn.host) -m str users.localhost }
    use_backend orders_backend        if { var(txn.host) -m str orders.localhost }
    use_backend payments_backend      if { var(txn.host) -m str payments.localhost }
    use_backend inventory_backend     if { var(txn.host) -m str inventory.localhost }
    use_backend notifications_backend if { var(txn.host) -m str notifications.localhost }
    use_backend search_backend        if { var(txn.host) -m str search.localhost }
    use_backend reporting_backend     if { var(txn.host) -m str reporting.localhost }
    use_backend logging_backend       if { var(txn.host) -m str logging.localhost }
    use_backend config_backend        if { var(txn.host) -m str config.localhost }
    use_backend gateway_backend       if { var(txn.host) -m str gateway.localhost }
    use_backend scheduler_backend     if { var(txn.host) -m str scheduler.localhost }
    use_backend cache_backend         if { var(txn.host) -m str cache.localhost }
    use_backend media_backend         if { var(txn.host) -m str media.localhost }
    use_backend mail_backend          if { var(txn.host) -m str mail.localhost }
    use_backend webhook_backend       if { var(txn.host) -m str webhook.localhost }
    use_backend audit_backend         if { var(txn.host) -m str audit.localhost }
    use_backend metrics_backend       if { var(txn.host) -m str metrics.localhost }
    use_backend session_backend       if { var(txn.host) -m str session.localhost }

    default_backend gitea_backend

#---------------------------------------------------------------------
# Backends
#---------------------------------------------------------------------
backend gitea_backend
    description "Gitea (nginx:80)"
    server gitea1 nginx:80
    server gitea2 nginx:80
    server gitea3 nginx:80


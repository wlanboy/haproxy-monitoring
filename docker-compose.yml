# Gemeinsame Haertung fuer alle Dienste: keine Linux-Capabilities, kein
# Rechtegewinn ueber setuid-Binaries.
x-hardening: &hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  nginx:
    <<: *hardening
    # Der nginx-Master startet als root (Port 80, Wechsel auf User nginx,
    # chown der Cache-Verzeichnisse). Nur diese Capabilities zurueckgeben.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    image: nginx:alpine
    container_name: nginx
    networks:
      - monitoring
    restart: unless-stopped

  haproxy:
    <<: *hardening
    image: haproxy:3.3-alpine
    container_name: haproxy
    user: haproxy
    depends_on:
      - nginx
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8080:8080"
      - "8404:8404"  # Stats-UI + Prometheus-Metrics
    healthcheck:
      # /healthz ist per monitor-uri im stats-Frontend definiert (ohne Auth, ohne Log)
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8404/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    networks:
      - monitoring
    restart: unless-stopped

  blackbox:
    <<: *hardening
    image: prom/blackbox-exporter:latest
    container_name: blackbox
    user: nobody  # Image laeuft sonst als root; HTTP-Probes brauchen keine Rechte (ICMP braeuchte NET_RAW)
    read_only: true
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "127.0.0.1:9115:9115"  # nur lokal: /probe?target= waere sonst ein offener SSRF-Proxy
    networks:
      - monitoring
    restart: unless-stopped

  haproxy-config-generator:
    <<: *hardening
    build: ./config-generator
    container_name: haproxy-config-generator
    read_only: true  # schreibt nur ins Volume /output
    depends_on:
      haproxy:
        condition: service_healthy
    volumes:
      - prometheus_targets:/output
    env_file:
      - ./config-generator/.env
    environment:
      - HAPROXY_STATS_URL=http://haproxy:8404/stats;csv
      - OUTPUT_FILE=/output/haproxy_backends.json
    networks:
      - monitoring
    restart: unless-stopped

  prometheus:
    <<: *hardening
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
      - prometheus_targets:/etc/prometheus/targets:ro
    ports:
      - "127.0.0.1:9090:9090"  # nur lokal: Prometheus hat keinen Login
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s
    networks:
      - monitoring
    restart: unless-stopped

  grafana:
    <<: *hardening
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/haproxy.json
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 1s
    networks:
      - monitoring
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prometheus_data:
  prometheus_targets:
  grafana_data:

networks:
  monitoring:
    driver: bridge

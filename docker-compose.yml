services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    networks:
      - monitoring
    restart: unless-stopped

  haproxy:
    image: haproxy:3.3-alpine
    container_name: haproxy
    user: haproxy
    depends_on:
      - nginx
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8080:8080"
      - "8404:8404"  # Stats-UI + Prometheus-Metrics
    healthcheck:
      # /healthz ist per monitor-uri im stats-Frontend definiert (ohne Auth, ohne Log)
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8404/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    networks:
      - monitoring
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: blackbox
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "127.0.0.1:9115:9115"  # nur lokal: /probe?target= waere sonst ein offener SSRF-Proxy
    networks:
      - monitoring
    restart: unless-stopped

  haproxy-config-generator:
    build: ./config-generator
    container_name: haproxy-config-generator
    depends_on:
      haproxy:
        condition: service_healthy
    volumes:
      - prometheus_targets:/output
    env_file:
      - ./config-generator/.env
    environment:
      - HAPROXY_STATS_URL=http://haproxy:8404/stats;csv
      - OUTPUT_FILE=/output/haproxy_backends.json
    networks:
      - monitoring
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
      - prometheus_targets:/etc/prometheus/targets:ro
    ports:
      - "127.0.0.1:9090:9090"  # nur lokal: --web.enable-lifecycle erlaubt POST /-/quit und /-/reload
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/haproxy.json
    networks:
      - monitoring
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  prometheus_targets:
  grafana_data:

networks:
  monitoring:
    driver: bridge
